    <p><strong>Administrador:</strong> <span th:text="${nombreAdmin}">Nombre</span></p>

    <p><strong>Teléfono / WhatsApp:</strong> <span th:text="${telefono}">000-000-0000</span></p>
    <p><strong>Horario de atención:</strong> <span th:text="${horario}">Horario</span></p>

</div>
